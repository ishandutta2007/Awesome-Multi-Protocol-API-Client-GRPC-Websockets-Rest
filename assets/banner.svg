<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#151b33" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulsePill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .stream-line { stroke-dasharray: 6, 6; animation: dashLine 2s linear infinite; }
    .pill { animation: pulsePill 4s ease-in-out infinite; }
    .pill:nth-child(2) { animation-delay: 0.8s; }
    .pill:nth-child(3) { animation-delay: 1.6s; }
    .pill:nth-child(4) { animation-delay: 2.4s; }
    .pill:nth-child(5) { animation-delay: 3.2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb1" cx="220" cy="110" r="140" fill="#6366f1" />
  <circle class="orb2" cx="980" cy="240" r="160" fill="#ec4899" />
  <circle class="orb1" cx="600" cy="300" r="120" fill="#a855f7" opacity="0.15" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.3">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Data Stream Line -->
  <path class="stream-line" d="M 50 180 Q 300 80, 600 180 T 1150 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />

  <!-- Floating Ambient Particles -->
  <circle class="p1" cx="180" cy="90" r="3" fill="#38bdf8" />
  <circle class="p2" cx="420" cy="70" r="4" fill="#a855f7" />
  <circle class="p3" cx="820" cy="110" r="3.5" fill="#ec4899" />
  <circle class="p1" cx="1020" cy="80" r="4" fill="#34d399" />
  <circle class="p2" cx="940" cy="290" r="3" fill="#f59e0b" />
  <circle class="p3" cx="260" cy="280" r="4" fill="#6366f1" />

  <!-- Outer Border -->
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Foreground Content: Header & Text -->
  <g id="foreground-content">
    <!-- Top Category Badge -->
    <g transform="translate(600, 52)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-115" cy="0" r="4" fill="#22c55e" />
      <text x="-102" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Multi-Protocol API Client
    </text>

    <!-- Subtitle Gradient Highlights -->
    <text x="600" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.5">
      REST &bull; GraphQL &bull; gRPC &bull; WebSockets &bull; MQTT &bull; SSE
    </text>

    <!-- Description -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Top commercial SaaS platforms &amp; open-source alternatives for unified API testing and debugging
    </text>

    <!-- Dynamic Protocol Interactive Cards / Pills at Bottom -->
    <g id="protocol-pills" transform="translate(180, 240)">
      <!-- REST -->
      <g class="pill" transform="translate(0, 0)">
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
        <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">REST &amp; HTTP/3</text>
        <text x="72" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">JSON &bull; XML &bull; OpenAPI</text>
      </g>

      <!-- gRPC -->
      <g class="pill" transform="translate(170, 0)">
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" />
        <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#818cf8">gRPC &amp; Protobuf</text>
        <text x="72" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Streaming &bull; Reflection</text>
      </g>

      <!-- GraphQL -->
      <g class="pill" transform="translate(340, 0)">
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" />
        <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f472b6">GraphQL</text>
        <text x="72" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Schema &bull; Subscriptions</text>
      </g>

      <!-- WebSockets -->
      <g class="pill" transform="translate(510, 0)">
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" />
        <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">WebSockets &amp; SSE</text>
        <text x="72" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Bi-directional &bull; Realtime</text>
      </g>

      <!-- MQTT & Sockets -->
      <g class="pill" transform="translate(680, 0)">
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
        <rect width="145" height="52" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" />
        <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">MQTT &amp; Socket.IO</text>
        <text x="72" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">IoT &bull; Event Message</text>
      </g>
    </g>
  </g>
</svg>
